<svg xmlns="http://www.w3.org/2000/svg" width="900" height="598" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" viewBox="0 0 900 598"><defs><clipPath id="win"><rect width="900" height="598" x="0" y="0" rx="11"/></clipPath><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".28" stdDeviation="10"/></filter></defs><g clip-path="url(#win)" filter="url(#shadow)"><rect width="900" height="598" x="0" y="0" fill="#1d1f21"/><rect width="900" height="38" x="0" y="0" fill="#2f3134"/><circle cx="22" cy="19" r="6" fill="#ff5f57"/><circle cx="42" cy="19" r="6" fill="#febc2e"/><circle cx="62" cy="19" r="6" fill="#28c840"/><text x="450" y="23" fill="#b9b9b9" font-size="12" text-anchor="middle">Three layers</text><line x1="0" x2="900" y1="38" y2="38" stroke="#000" stroke-opacity=".35"/><g transform="translate(0 38)"><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8c8c8c" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="780" height="112" x="60" y="36" fill="#26282b" stroke="#3a3d41" stroke-width="1.5" rx="10"/><text x="84" y="66" fill="#c58af9" font-size="12" font-weight="700" letter-spacing="1.2">SHELL</text><text x="152" y="66" fill="#e6e6e6" font-size="14" font-weight="600">Claude Code plugin</text><text x="84" y="92" fill="#c2c2c2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">commands/ skills/ hooks/ .mcp.json</text><text x="84" y="120" fill="#9a9a9a" font-size="12.5">Thin, no logic. It only teaches the protocol: ask the CLI, do the work, report back.</text><line x1="450" x2="450" y1="148" y2="188" stroke="#8c8c8c" stroke-width="1.5" marker-end="url(#a)"/><rect width="780" height="222" x="60" y="190" fill="#26282b" stroke="#3a3d41" stroke-width="1.5" rx="10"/><text x="84" y="220" fill="#5ac8fa" font-size="12" font-weight="700" letter-spacing="1.2">ENGINE</text><text x="160" y="220" fill="#e6e6e6" font-size="14" font-weight="600">the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gw</tspan> CLI — TypeScript / Node</text><text x="646" y="220" fill="#33c85a" font-size="12">■</text><text x="660" y="220" fill="#9a9a9a" font-size="11.5">six packages, all built</text><rect width="176" height="56" x="84" y="238" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5" rx="7"/><text x="98" y="262" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">core</text><text x="98" y="280" fill="#9a9a9a" font-size="11">state machine · IR types</text><rect width="176" height="56" x="272" y="238" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5" rx="7"/><text x="286" y="262" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">figma</text><text x="286" y="280" fill="#9a9a9a" font-size="11">API · distill · assets</text><rect width="176" height="56" x="460" y="238" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5" rx="7"/><text x="474" y="262" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">cli</text><text x="474" y="280" fill="#9a9a9a" font-size="11">the gw binary</text><rect width="168" height="56" x="648" y="238" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5" rx="7"/><text x="662" y="262" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">tokens</text><text x="662" y="280" fill="#9a9a9a" font-size="11">ΔE match · write-back</text><rect width="176" height="56" x="84" y="308" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5" rx="7"/><text x="98" y="332" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">library</text><text x="98" y="350" fill="#9a9a9a" font-size="11">registry · placements</text><rect width="176" height="56" x="272" y="308" fill="#1b2a38" stroke="#33c85a" stroke-width="1.5" rx="7"/><text x="286" y="332" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600">verify</text><text x="286" y="350" fill="#9a9a9a" font-size="11">Playwright · metrics</text><rect width="356" height="56" x="460" y="308" fill="#1d1f21" stroke="#3a3d41" stroke-width="1.5" rx="7"/><text x="474" y="332" fill="#8c8c8c" font-size="11.5">The adapters live inside <tspan fill="#9a9a9a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify</tspan>&apos;s harness,</text><text x="474" y="350" fill="#8c8c8c" font-size="11.5">the dashboard inside <tspan fill="#9a9a9a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cli</tspan>. Neither earned a package.</text><text x="84" y="392" fill="#9a9a9a" font-size="12.5">The adapter boundary is sacred: it owns the file shape and the mount code, never the IR or the state machine.</text><line x1="270" x2="270" y1="412" y2="452" stroke="#8c8c8c" stroke-width="1.5" marker-end="url(#a)"/><line x1="670" x2="670" y1="412" y2="452" stroke="#8c8c8c" stroke-width="1.5" marker-end="url(#a)"/><rect width="420" height="76" x="60" y="454" fill="#26282b" stroke="#3a3d41" stroke-width="1.5" rx="10"/><text x="84" y="480" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">.gridwright/</text><text x="84" y="502" fill="#9a9a9a" font-size="11.5">runs/ state · IR · screenshots — scaffolding, gitignored</text><text x="84" y="519" fill="#9a9a9a" font-size="11.5">baselines/ golden tests — committed</text><rect width="340" height="76" x="500" y="454" fill="#26282b" stroke="#3a3d41" stroke-width="1.5" rx="10"/><text x="524" y="480" fill="#e6e6e6" font-size="13" font-weight="600">the consuming project</text><text x="524" y="502" fill="#9a9a9a" font-size="11.5">components · design tokens · regression tests</text><text x="524" y="519" fill="#9a9a9a" font-size="11.5">every run leaves more of all three</text></g></g><rect width="899" height="597" x=".5" y=".5" fill="none" stroke="#000" stroke-opacity=".35" rx="11"/></svg>