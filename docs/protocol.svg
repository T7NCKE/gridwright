<svg xmlns="http://www.w3.org/2000/svg" width="900" height="468" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" viewBox="0 0 900 468"><defs><clipPath id="win"><rect width="900" height="468" x="0" y="0" rx="11"/></clipPath><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".28" stdDeviation="10"/></filter></defs><g clip-path="url(#win)" filter="url(#shadow)"><rect width="900" height="468" x="0" y="0" fill="#1d1f21"/><rect width="900" height="38" x="0" y="0" fill="#2f3134"/><circle cx="22" cy="19" r="6" fill="#ff5f57"/><circle cx="42" cy="19" r="6" fill="#febc2e"/><circle cx="62" cy="19" r="6" fill="#28c840"/><text x="450" y="23" fill="#b9b9b9" font-size="12" text-anchor="middle">The control loop</text><line x1="0" x2="900" y1="38" y2="38" stroke="#000" stroke-opacity=".35"/><g transform="translate(0 38)"><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8c8c8c" d="M0 0 L10 5 L0 10 z"/></marker><marker id="r" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#f5bd4f" d="M0 0 L10 5 L0 10 z"/></marker></defs><text x="40" y="64" fill="#9a9a9a" font-size="12.5">Claude does not decide which stage comes next. It asks. The order is not persuasion — it is control flow.</text><rect width="188" height="96" x="40" y="96" fill="#1b2a38" stroke="#5ac8fa" stroke-width="1.5" rx="9"/><circle cx="62" cy="118" r="10" fill="#5ac8fa"/><text x="62" y="122" fill="#26282b" font-size="11" font-weight="700" text-anchor="middle">1</text><text x="80" y="123" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600">gw next</text><text x="58" y="150" fill="#c2c2c2" font-size="11.5">The CLI reads state.json and</text><text x="58" y="167" fill="#c2c2c2" font-size="11.5">returns the directive:</text><text x="58" y="183" fill="#9a9a9a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">{stage, actor, inputs, gate}</text><line x1="230" x2="268" y1="144" y2="144" stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)"/><rect width="188" height="96" x="270" y="96" fill="#2a2338" stroke="#c58af9" stroke-width="1.5" rx="9"/><circle cx="292" cy="118" r="10" fill="#c58af9"/><text x="292" y="122" fill="#26282b" font-size="11" font-weight="700" text-anchor="middle">2</text><text x="310" y="123" fill="#e6e6e6" font-size="13.5" font-weight="600">Claude works</text><text x="288" y="150" fill="#c2c2c2" font-size="11.5">The creative part only: reads</text><text x="288" y="167" fill="#c2c2c2" font-size="11.5">the IR, writes the component</text><text x="288" y="184" fill="#c2c2c2" font-size="11.5">the way this repo writes them.</text><line x1="460" x2="498" y1="144" y2="144" stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)"/><rect width="188" height="96" x="500" y="96" fill="#1b2a38" stroke="#5ac8fa" stroke-width="1.5" rx="9"/><circle cx="522" cy="118" r="10" fill="#5ac8fa"/><text x="522" y="122" fill="#26282b" font-size="11" font-weight="700" text-anchor="middle">3</text><text x="540" y="123" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600">gw verify</text><text x="518" y="150" fill="#c2c2c2" font-size="11.5">Renders and measures the</text><text x="518" y="167" fill="#c2c2c2" font-size="11.5">three dimensions on every</text><text x="518" y="184" fill="#c2c2c2" font-size="11.5">viewport. Worst one wins.</text><line x1="690" x2="712" y1="144" y2="144" stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)"/><rect width="144" height="96" x="716" y="96" fill="#26282b" stroke="#3a3d41" stroke-width="1.5" rx="9"/><circle cx="738" cy="118" r="10" fill="#8c8c8c"/><text x="738" y="122" fill="#26282b" font-size="11" font-weight="700" text-anchor="middle">4</text><text x="756" y="123" fill="#e6e6e6" font-size="13.5" font-weight="600">score</text><text x="734" y="152" fill="#33c85a" font-size="11.5">evidence, not a gate</text><text x="734" y="176" fill="#f5bd4f" font-size="11.5">the person decides</text><path fill="none" stroke="#f5bd4f" stroke-dasharray="5 4" stroke-width="1.6" marker-end="url(#r)" d="M788 194 L788 232 L364 232 L364 196"/><rect width="256" height="32" x="452" y="216" fill="#33291a" stroke="#f0d9b5" stroke-width="1" rx="6"/><text x="580" y="237" fill="#f5bd4f" font-size="11.5" text-anchor="middle">refine --focus=structural · hard cap of 4</text><rect width="820" height="80" x="40" y="278" fill="#26282b" stroke="#3a3d41" stroke-width="1.5" rx="9"/><text x="64" y="306" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">.gridwright/runs/&lt;id&gt;/state.json</text><text x="64" y="328" fill="#9a9a9a" font-size="12">The single source of truth. Survives interruptions, compaction and restarts.</text><text x="64" y="347" fill="#9a9a9a" font-size="12">Closing a stage that is not the current one throws. The three mandatory ones cannot be skipped at all.</text><text x="40" y="392" fill="#9a9a9a" font-size="12.5">There is no way to jump to <tspan fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">golden</tspan> without verifying first, because the CLI will not allow it — not because the prompt asked nicely.</text></g></g><rect width="899" height="467" x=".5" y=".5" fill="none" stroke="#000" stroke-opacity=".35" rx="11"/></svg>