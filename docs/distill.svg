<svg xmlns="http://www.w3.org/2000/svg" width="900" height="458" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" viewBox="0 0 900 458"><defs><clipPath id="win"><rect width="900" height="458" x="0" y="0" rx="11"/></clipPath><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".28" stdDeviation="10"/></filter></defs><g clip-path="url(#win)" filter="url(#shadow)"><rect width="900" height="458" x="0" y="0" fill="#1d1f21"/><rect width="900" height="38" x="0" y="0" fill="#2f3134"/><circle cx="22" cy="19" r="6" fill="#ff5f57"/><circle cx="42" cy="19" r="6" fill="#febc2e"/><circle cx="62" cy="19" r="6" fill="#28c840"/><text x="450" y="23" fill="#b9b9b9" font-size="12" text-anchor="middle">Why the IR exists</text><line x1="0" x2="900" y1="38" y2="38" stroke="#000" stroke-opacity=".35"/><g transform="translate(0 38)"><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8c8c8c" d="M0 0 L10 5 L0 10 z"/></marker><marker id="x" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#ff6b6b" d="M0 0 L10 5 L0 10 z"/></marker></defs><text x="40" y="64" fill="#9a9a9a" font-size="12.5">Feeding the raw tree to the model is not just expensive. It produces worse code.</text><rect width="248" height="150" x="40" y="96" fill="#26282b" stroke="#3a3d41" stroke-width="1.5" rx="9"/><text x="64" y="124" fill="#e6e6e6" font-size="13.5" font-weight="600">Raw Figma tree</text><text x="64" y="150" fill="#9a9a9a" font-size="12">2,000–5,000 nodes</text><text x="64" y="170" fill="#9a9a9a" font-size="12">absolute coordinates</text><text x="64" y="190" fill="#9a9a9a" font-size="12">nested fills, constraints, effects</text><text x="64" y="220" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">~312 KB</text><path stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)" d="M292 171 L332 171"/><rect width="130" height="62" x="336" y="140" fill="#1b2a38" stroke="#5ac8fa" stroke-width="1.5" rx="9"/><text x="401" y="167" fill="#e6e6e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" text-anchor="middle">distill</text><text x="401" y="186" fill="#9a9a9a" font-size="11" text-anchor="middle">deterministic</text><path stroke="#8c8c8c" stroke-width="1.6" marker-end="url(#a)" d="M470 171 L510 171"/><rect width="248" height="150" x="514" y="96" fill="#172a1e" stroke="#33c85a" stroke-width="1.5" rx="9"/><text x="538" y="124" fill="#e6e6e6" font-size="13.5" font-weight="600">The IR</text><text x="538" y="150" fill="#c2c2c2" font-size="12">~120 lines, semantic</text><text x="538" y="170" fill="#c2c2c2" font-size="12">roles, slots, resolved layout</text><text x="538" y="190" fill="#c2c2c2" font-size="12">this is what the model reads</text><text x="538" y="220" fill="#33c85a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">~4 KB</text><text x="786" y="164" fill="#33c85a" font-size="26" font-weight="700">99%</text><text x="786" y="184" fill="#9a9a9a" font-size="11.5">smaller</text><rect width="418" height="106" x="40" y="278" fill="#26282b" stroke="#3a3d41" stroke-width="1.5" rx="9"/><text x="64" y="304" fill="#e6e6e6" font-size="12.5" font-weight="600">Two isomorphisms, not heuristics</text><text x="64" y="330" fill="#5ac8fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">auto-layout</text><text x="154" y="330" fill="#9a9a9a" font-size="12">→</text><text x="174" y="330" fill="#5ac8fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">flex-col gap-6</text><text x="64" y="350" fill="#5ac8fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">variants</text><text x="154" y="350" fill="#9a9a9a" font-size="12">→</text><text x="174" y="350" fill="#5ac8fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">props</text><text x="64" y="372" fill="#9a9a9a" font-size="11.5">Side effect: it cannot emit margins between siblings.</text><rect width="382" height="106" x="478" y="278" fill="#301c1c" stroke="#f0bcbc" stroke-width="1.5" rx="9"/><text x="502" y="304" fill="#e6e6e6" font-size="12.5" font-weight="600">No auto-layout → it halts</text><text x="502" y="332" fill="#9a9a9a" font-size="11.5">If the design was positioned by hand there is no</text><text x="502" y="349" fill="#9a9a9a" font-size="11.5">layout to infer. A better prompt will not fix that.</text><text x="502" y="370" fill="#ff8a8a" font-size="11.5" font-weight="600">It gets fixed in Figma.</text></g></g><rect width="899" height="457" x=".5" y=".5" fill="none" stroke="#000" stroke-opacity=".35" rx="11"/></svg>